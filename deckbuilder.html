<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game Deck Builder</title>
    <link rel="stylesheet" href="deckbuilder.css">
</head>
<body>
<!--<header>-->
<!--    <h1>Deck Builder</h1>-->
<!--</header>-->
<main class="deckbuilder-layout">
    <section class="available-panel">
        <h2>Available Cards</h2>

        <div id="card-filters" class="card-filters">
            <div class="filter-group">
                <span class="filter-group-title">Type</span>
                <label>
                    <input type="checkbox" name="card-type" value="STRIKE" checked>
                    Strike
                </label>
                <label>
                    <input type="checkbox" name="card-type" value="ALLY" checked>
                    Ally
                </label>
                <label>
                    <input type="checkbox" name="card-type" value="ADVANTAGE" checked>
                    Advantage
                </label>
            </div>

            <div class="filter-group">
                <span class="filter-group-title">Trait</span>
                <div id="trait-filters"></div>
            </div>
        </div>

        <div id="available-cards" class="card-grid"></div>
    </section>
    <aside class="right-column">
        <section class="info-panel">
            <h2>Chamber / Deck Info</h2>
            <div id="current-chamber">
                <div id="selected-chamber"></div>
                <div class="chamber-preview">
                    <div>
                        <img id="chamber-front">
                    </div>
                    <div>
                        <img id="chamber-back">
                    </div>
                </div>
            </div>
            <div id="deck-information"></div>
        </section>
        <section class="deck-panel">
            <h2 id="deck-title">Cards in Deck <span id="deck-header-card-count">0 / 60</span></h2>
            <div id="deck-cards" class="card-grid"></div>
        </section>
    </aside>
</main>
<script src="deckbuilder.js"></script>
</body>
</html>
